# Publication du site sur GitHub Pages (#167)
# Remplace la publication automatique « depuis une branche », bloquée côté GitHub le 11/11/2026.
# À chaque push sur main (et à la demande, onglet Actions → « Run workflow »),
# le dépôt est publié tel quel : site statique, sans Jekyll.
# Réglage associé : Settings → Pages → Source = « GitHub Actions ».
name: publication du site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle remplace celle en attente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5
      - name: Préparer le site (sans fichiers du dépôt inutiles en ligne)
        run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude '.github' --exclude '.githooks' --exclude '_site' --exclude '/modeles' --exclude '/sonar-project.properties' --exclude '/tests' --exclude '/node_modules' --exclude '/package*.json' --exclude '/playwright.config.mjs' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: _site
      - id: publication
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
