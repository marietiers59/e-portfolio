# Vérifications de chaque merge request (#199, #200)
# 1. Les pages publiées doivent correspondre à leur modèle bilingue (modeles/, outils/pages/LISEZMOI.md).
# 2. Les tests de bout en bout passent (tests/LISEZMOI.md) ; rapport et couverture gardés 14 jours.
name: vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pages:
    name: pages à jour par rapport aux modèles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparer les pages publiées aux modèles
        run: node outils/pages/construire.mjs --verifier

  tests:
    name: tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    needs: pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer Playwright et Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Lancer les tests (#200)
        run: npm test
      - name: Garder le rapport et la couverture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: |
            rapport-tests/
            couverture/
          retention-days: 14
