# Analyse SonarQube / SonarQube Cloud (#199)
sonar.projectKey=marietiers59_e-portfolio
sonar.projectName=e-portfolio — Marie Tiers
sonar.sourceEncoding=UTF-8

# Bibliothèque tierce (Matter.js) : ni analysée ni comptée
sonar.exclusions=scripts/vendor/**

# Pages publiées générées à partir de modeles/ (outils/pages/construire.mjs) :
# analysées, mais pas comptées dans la duplication (la source unique est le modèle).
# Idem pour les fragments du nuage, générés par outils/nuage-competences.
sonar.cpd.exclusions=index.html,pages/**,en/**,modeles/fragments/**
